[BountyPay]
; 0 = the add-on does nothing
Enabled=1
; 1 = only write what would be taken to BountyPay.log, change nothing
DryRun=0
; 1 = death pays the bounty only when the law is after you at that moment,
;     or when lawmen or bounty hunters killed you
; 0 = any death in a state where you have a bounty
RequireWanted=1
; top-left notice with the amount paid
Notify=1
NotifyMs=7000
; wait after respawn / release before settling, ms
SettleMs=4000
; longer than this between death and respawn = a save was loaded, nothing is taken
DeathWindowMs=90000
ArrestWindowMs=240000
